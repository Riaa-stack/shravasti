[project]
name = "scholarforge-backend"
version = "0.1.0"
description = "AI-Powered Research Assistant Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "neo4j>=5.17.0",
    "chromadb>=0.4.22",
    "langchain>=0.1.0",
    "langgraph>=0.0.21",
    "langchain-community>=0.0.13",
    "pymupdf>=1.23.8",
    "easyocr>=1.7.1",
    "spacy>=3.7.2",
    "nltk>=3.8.1",
    "sentence-transformers>=2.3.1",
    "httpx>=0.26.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.22",
    "weasyprint>=60.2; sys_platform != 'win32'",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "httpx>=0.26.0",
    "ruff>=0.1.14",
    "black>=24.1.1",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
